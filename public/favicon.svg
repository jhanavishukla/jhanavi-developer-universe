<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Base Hexagon Frame -->
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)" stroke="url(#cyber-grad)" stroke-width="2.5" />
  <!-- Futuristic J Glyph -->
  <path d="M38 18 H46 V38 C46 45 40 49 32 49 C24 49 20 44 20 38 L27 38 C27 41 29 43 32 43 C36 43 38 41 38 37 Z" 
        fill="url(#cyber-grad)" 
        filter="url(#glow)" />
  <!-- Small Terminal Dot -->
  <circle cx="44" cy="22" r="2.5" fill="#06b6d4" />
</svg>

